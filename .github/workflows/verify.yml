name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality gates that need no build output ──
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run validate:metadata
      - run: bun run validate:test-architecture
      - run: bun run validate:security

  # ── Build, typecheck, package validation, perf ──
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run --filter '*' build
      - run: bun run --filter '*' typecheck
      - run: bun run validate:packages
      - run: bun run validate:release
      - run: bun run perf:baseline

  # ── Unit / contract / compatibility tests ──
  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run --filter '*' build
      - run: bun run test:unit
      - run: bun run test:compatibility
      - run: bunx vitest run tests/compatibility/open-in-editor.spec.ts tests/compatibility/open-in-editor-executable.spec.ts

  # ── E2E browser tests ──
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run --filter '*' build
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:e2e
      - run: bun run test:e2e:webkit
      - run: bun run test:e2e:production

  # ── Dependency vulnerability scan ──
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun audit
